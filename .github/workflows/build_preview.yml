name: Build & Release
# Build BOTH the stable (release) and preview (beta) APKs and publish them
# together in a single GitHub Release on every push to main (or manually).

on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '!**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare-build:
    runs-on: 'ubuntu-24.04'
    outputs:
      VERSION_NAME: ${{ steps.env.outputs.VERSION_NAME }}
      COMMIT_COUNT: ${{ steps.read_env.outputs.COMMIT_COUNT }}
      TAG_NAME: ${{ steps.env.outputs.TAG_NAME }}
      STABLE_VERSION: ${{ steps.env.outputs.STABLE_VERSION }}
      PREVIEW_VERSION: ${{ steps.env.outputs.PREVIEW_VERSION }}
      COMMIT_LOGS: ${{ steps.commit_logs.outputs.COMMIT_LOGS }}
      PREV_TAG_NAME: ${{ steps.previous_commit.outputs.PREV_TAG_NAME }}
    steps:
      - name: Clone Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Get previous release
        id: last_release
        uses: InsonusK/get-latest-release@7a9ff16c8c6b7ead5d71c0f1cc61f2703170eade # v1.1.0
        with:
          myToken: ${{ github.token }}
          exclude_types: "draft"
          view_top: 1

      - name: Read commit info
        id: read_env
        run: |
          commit_count=$(git rev-list --count HEAD)
          current_sha=$(git rev-parse --short HEAD)
          echo "COMMIT_COUNT=$commit_count"
          echo "COMMIT_COUNT=$commit_count" >> $GITHUB_OUTPUT
          echo "CURRENT_SHA=$current_sha"
          echo "CURRENT_SHA=$current_sha" >> $GITHUB_OUTPUT

      - name: Previous commit
        id: previous_commit
        run: |
          commit_count_diff=$(git rev-list --count "${{ steps.last_release.outputs.tag_name }}"..HEAD)
          if [ "${commit_count_diff}" -eq 0 ]; then
            commit_count_diff=1
          fi
          prev_release_sha=$(git rev-parse --short HEAD~$commit_count_diff)
          echo "PREV_RELEASE_SHA=$prev_release_sha"
          echo "PREV_RELEASE_SHA=$prev_release_sha" >> $GITHUB_OUTPUT
          echo "PREV_TAG_NAME=${{ steps.last_release.outputs.tag_name }}"
          echo "PREV_TAG_NAME=${{ steps.last_release.outputs.tag_name }}" >> $GITHUB_OUTPUT

      - name: Prepare env
        id: env
        run: |
          # Read versionName (e.g. 1.14.1) from app/build.gradle.kts
          version_name=$(grep -E '^\s*versionName\s*=\s*"[0-9]+\.[0-9]+\.[0-9]+"' app/build.gradle.kts | sed -E 's/.*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/' | head -n 1)
          commit_count=$(git rev-list --count HEAD)

          echo "VERSION_NAME=$version_name"
          echo "VERSION_NAME=$version_name" >> $GITHUB_OUTPUT
          echo "TAG_NAME=v${version_name}-r${commit_count}"
          echo "TAG_NAME=v${version_name}-r${commit_count}" >> $GITHUB_OUTPUT
          echo "STABLE_VERSION=${version_name}"
          echo "STABLE_VERSION=${version_name}" >> $GITHUB_OUTPUT
          echo "PREVIEW_VERSION=${version_name}-r${commit_count}"
          echo "PREVIEW_VERSION=${version_name}-r${commit_count}" >> $GITHUB_OUTPUT

      - name: Commit logs
        id: commit_logs
        run: |
          echo "COMMIT_LOGS<<{delimiter}
          $(curl -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/thealtersky/komikku/compare/${{ steps.previous_commit.outputs.PREV_RELEASE_SHA }}...${{ steps.read_env.outputs.CURRENT_SHA }}" \
            | jq '[.commits[]|{message:(.commit.message | split("\n")), username:.author.login}]' \
            | jq -r '.[]|"- \(.message | first) (@\(.username))"')
          {delimiter}" >> $GITHUB_OUTPUT

      - name: Create tag
        if: ${{ github.ref }} == "refs/heads/main"
        run: |
          git tag "${{ steps.env.outputs.TAG_NAME }}"
          git push origin "${{ steps.env.outputs.TAG_NAME }}"
          echo "New tag created: ${{ steps.env.outputs.TAG_NAME }}"

  build-app:
    runs-on: 'ubuntu-24.04'
    needs: prepare-build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Clone Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Write client_secrets.json (optional)
        shell: bash
        env:
          CLIENT_SECRETS_JSON: ${{ secrets.GOOGLE_CLIENT_SECRETS_JSON }}
        run: |
          if [ -n "$CLIENT_SECRETS_JSON" ]; then
            mkdir -p app/src/main/assets
            printf '%s' "$CLIENT_SECRETS_JSON" > app/src/main/assets/client_secrets.json
          fi

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Check code format
        run: ./gradlew spotlessCheck

      - name: Build stable app
        run: ./gradlew assembleRelease -Penable-updater

      - name: Build preview app
        run: ./gradlew assemblePreview -Penable-updater

      - name: Run unit tests
        run: ./gradlew testReleaseUnitTest

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: "**/*.apk"
          retention-days: 1

      - name: Upload stable mapping
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mapping-${{ github.sha }}
          path: app/build/outputs/mapping/release

  release-app:
    runs-on: 'ubuntu-24.04'
    needs:
      - prepare-build
      - build-app
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      - name: Sign stable APK
        uses: r0adkll/sign-android-release@f30bdd30588842ac76044ecdbd4b6d0e3e813478
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '35.0.1'

      - name: Sign preview APK
        uses: r0adkll/sign-android-release@f30bdd30588842ac76044ecdbd4b6d0e3e813478
        with:
          releaseDirectory: app/build/outputs/apk/preview
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '35.0.1'

      - name: Rename stable APKs
        run: |
          set -e
          V="${{ needs.prepare-build.outputs.STABLE_VERSION }}"
          mv app/build/outputs/apk/release/app-universal-release-unsigned-signed.apk Komikku-$V.apk
          mv app/build/outputs/apk/release/app-arm64-v8a-release-unsigned-signed.apk Komikku-arm64-v8a-$V.apk
          mv app/build/outputs/apk/release/app-armeabi-v7a-release-unsigned-signed.apk Komikku-armeabi-v7a-$V.apk
          mv app/build/outputs/apk/release/app-x86-release-unsigned-signed.apk Komikku-x86-$V.apk
          mv app/build/outputs/apk/release/app-x86_64-release-unsigned-signed.apk Komikku-x86_64-$V.apk

      - name: Rename preview APKs
        run: |
          set -e
          V="${{ needs.prepare-build.outputs.PREVIEW_VERSION }}"
          mv app/build/outputs/apk/preview/app-universal-preview-signed.apk Komikku-Preview-$V.apk
          mv app/build/outputs/apk/preview/app-arm64-v8a-preview-signed.apk Komikku-arm64-v8a-Preview-$V.apk
          mv app/build/outputs/apk/preview/app-armeabi-v7a-preview-signed.apk Komikku-armeabi-v7a-Preview-$V.apk
          mv app/build/outputs/apk/preview/app-x86-preview-signed.apk Komikku-x86-Preview-$V.apk
          mv app/build/outputs/apk/preview/app-x86_64-preview-signed.apk Komikku-x86_64-Preview-$V.apk

      - name: Create release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ needs.prepare-build.outputs.TAG_NAME }}
          name: Komikku ${{ needs.prepare-build.outputs.STABLE_VERSION }} (Preview ${{ needs.prepare-build.outputs.PREVIEW_VERSION }})
          body: |
            [![GitHub downloads](https://img.shields.io/github/downloads/thealtersky/komikku/${{ needs.prepare-build.outputs.TAG_NAME }}/total?label=Downloaded&labelColor=27303D&color=0D1117&logo=github&logoColor=FFFFFF&style=flat)](https://github.com/thealtersky/komikku/releases/${{ needs.prepare-build.outputs.TAG_NAME }})
            #### Stable `${{ needs.prepare-build.outputs.STABLE_VERSION }}`
            Files prefixed `Komikku-` (appId `app.komikku`): `Komikku-${{ needs.prepare-build.outputs.STABLE_VERSION }}.apk` for the universal build.

            #### Preview `${{ needs.prepare-build.outputs.PREVIEW_VERSION }}`
            Files prefixed `Komikku-Preview-` (appId `app.komikku.beta`): `Komikku-Preview-${{ needs.prepare-build.outputs.PREVIEW_VERSION }}.apk` for the universal build.

            #### What's Changed
            ##### New

            ##### Improve

            ##### Fix

            ${{ needs.prepare-build.outputs.COMMIT_LOGS }}

            **Full Changelog**: [thealtersky/komikku@${{ needs.prepare-build.outputs.PREV_TAG_NAME }}...${{ needs.prepare-build.outputs.TAG_NAME }}](https://github.com/thealtersky/komikku/compare/${{ needs.prepare-build.outputs.PREV_TAG_NAME }}...${{ needs.prepare-build.outputs.TAG_NAME }})
          files: |
            Komikku-${{ needs.prepare-build.outputs.STABLE_VERSION }}.apk
            Komikku-arm64-v8a-${{ needs.prepare-build.outputs.STABLE_VERSION }}.apk
            Komikku-armeabi-v7a-${{ needs.prepare-build.outputs.STABLE_VERSION }}.apk
            Komikku-x86-${{ needs.prepare-build.outputs.STABLE_VERSION }}.apk
            Komikku-x86_64-${{ needs.prepare-build.outputs.STABLE_VERSION }}.apk
            Komikku-Preview-${{ needs.prepare-build.outputs.PREVIEW_VERSION }}.apk
            Komikku-arm64-v8a-Preview-${{ needs.prepare-build.outputs.PREVIEW_VERSION }}.apk
            Komikku-armeabi-v7a-Preview-${{ needs.prepare-build.outputs.PREVIEW_VERSION }}.apk
            Komikku-x86-Preview-${{ needs.prepare-build.outputs.PREVIEW_VERSION }}.apk
            Komikku-x86_64-Preview-${{ needs.prepare-build.outputs.PREVIEW_VERSION }}.apk
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
